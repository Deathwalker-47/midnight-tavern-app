<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#14100C;color:#EADCBE;font-family:"IBM Plex Sans",sans-serif;-webkit-font-smoothing:antialiased}
  ::selection{background:rgba(217,166,72,.25)}
  a{color:#D9A648;text-decoration:none}a:hover{color:#F2C56B}
  ::-webkit-scrollbar{width:11px}::-webkit-scrollbar-thumb{background:#382E21;border-radius:6px;border:3px solid #14100C}
  @keyframes mt-fade{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001s!important}}
</style>
</helmet>
<div style="display:flex;height:100vh;width:100vw;overflow:hidden;background:#14100C">
  <nav style="width:72px;flex:0 0 72px;background:#1B1611;border-right:1px solid #382E21;display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:4px">
    <div style="width:40px;height:40px;border-radius:9px;background:linear-gradient(145deg,#2C241B,#1B1611);border:1px solid rgba(216,170,90,.25);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:24px;color:#D9A648;margin-bottom:14px">M</div>
    <sc-for list="{{ railItems }}" as="it" hint-placeholder-count="5">
      <a href="{{ it.href }}" title="{{ it.label }}" style="{{ it.style }}"><span style="{{ it.iconStyle }}">{{ it.glyph }}</span><span style="font-size:9px">{{ it.label }}</span></a>
    </sc-for>
    <div style="flex:1"></div>
    <div style="width:52px;display:flex;flex-direction:column;align-items:center;gap:9px;padding-top:8px;border-top:1px solid #382E21">
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:9px;height:9px;border-radius:50%;background:#8FB573;box-shadow:0 0 8px #8FB573"></span><span style="font-size:8px;color:#6E5F49">Sonnet</span></div>
      <div style="font-size:8px;color:#6E5F49;text-align:center;border:1px solid #382E21;border-radius:5px;padding:3px 4px;line-height:1.15">Trial<br>9d</div>
    </div>
  </nav>

  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <header style="flex:0 0 auto;padding:26px 40px 20px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid #382E21">
      <div>
        <div style="font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:600;color:#EADCBE;line-height:1">Personas</div>
        <div style="font-size:13px;color:#A08D6C;margin-top:6px">The selves you step into. Pick one when you start a story — the world builds your sheet around it.</div>
      </div>
      <a href="CardCreator.dc.html" style="background:#D9A648;color:#1B1611;border-radius:8px;padding:11px 18px;font-weight:600;font-size:14px">＋ New persona</a>
    </header>

    <div style="flex:1;overflow-y:auto;padding:28px 40px 60px">
      <div style="max-width:1000px">
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px">
          <sc-for list="{{ personas }}" as="p" hint-placeholder-count="4">
            <a href="CardCreator.dc.html" style="{{ p.cardStyle }}">
              <div style="display:flex;gap:13px;align-items:center">
                <div style="{{ p.avatarStyle }}">{{ p.initials }}</div>
                <div style="flex:1;min-width:0">
                  <div style="display:flex;align-items:center;gap:7px"><span style="font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:#EADCBE">{{ p.name }}</span><span style="{{ p.defStyle }}">{{ p.defLabel }}</span></div>
                  <div style="font-size:12px;color:#A08D6C">{{ p.tagline }}</div>
                </div>
              </div>
              <div style="font-size:12.5px;color:#A08D6C;line-height:1.55;margin-top:12px;min-height:36px">{{ p.blurb }}</div>
              <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:12px">
                <sc-for list="{{ p.traits }}" as="t" hint-placeholder-count="3"><span style="font-size:11px;color:#A08D6C;background:#2C241B;border:1px solid #382E21;border-radius:5px;padding:3px 8px">{{ t }}</span></sc-for>
              </div>
              <div style="margin-top:12px;padding-top:11px;border-top:1px solid #382E21;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#6E5F49">used in {{ p.used }}</div>
            </a>
          </sc-for>

          <!-- new persona tile -->
          <a href="CardCreator.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:transparent;border:1px dashed #382E21;border-radius:11px;padding:30px;min-height:180px;color:#6E5F49">
            <span style="font-size:30px">＋</span><span style="font-size:13px">Create a persona</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals(){
    const railItems=[
      {label:'Library',glyph:'❏',href:'Library.dc.html',active:false},
      {label:'Story',glyph:'✎',href:'Play.dc.html',active:false},
      {label:'Personas',glyph:'☙',href:'Personas.dc.html',active:true},
      {label:'Lore',glyph:'❦',href:'Lorebook.dc.html',active:false},
      {label:'Settings',glyph:'⚙',href:'Settings.dc.html',active:false},
    ].map(it=>({...it,style:`display:flex;flex-direction:column;align-items:center;gap:3px;width:56px;padding:8px 0;border-radius:8px;color:${it.active?'#EADCBE':'#6E5F49'};background:${it.active?'#2C241B':'transparent'};border:1px solid ${it.active?'rgba(216,170,90,.2)':'transparent'}`,iconStyle:`font-size:18px;color:${it.active?'#D9A648':'#8A7A5c'}`}));

    const defs=[
      {name:'Kestrel Vane',initials:'KV',tagline:'Sellsword courier',def:true,blurb:'A courier who takes the roads no one else will. Loyal to the contract, and lately to more than that.',traits:['Steady hands','Reluctant hero','Blade-trained'],used:'Embers of the Ashen Vale',accent:'#D9A648'},
      {name:'Sable Morrow',initials:'SM',tagline:'Disgraced cartographer',def:false,blurb:'Maps the places that don’t want to be mapped. Carries a debt and a grudge in equal measure.',traits:['Curious','Silver-tongued','Haunted'],used:'The Tidewright’s Bargain',accent:'#74B8AE'},
      {name:'Orin Ashfield',initials:'OA',tagline:'Hedge-witch’s apprentice',def:false,blurb:'Half-trained in the old craft, wholly certain he can handle what he can’t.',traits:['Reckless','Bookish','Kind'],used:'not yet',accent:'#8FB573'},
    ];
    const personas=defs.map(p=>({...p,
      cardStyle:`display:block;background:linear-gradient(160deg,#231C15,#1B1611);border:1px solid ${p.def?'rgba(216,170,90,.22)':'#382E21'};border-radius:11px;padding:16px 17px`,
      avatarStyle:`width:44px;height:44px;flex:0 0 44px;border-radius:10px;background:#2C241B;border:1px solid ${p.accent}55;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:18px;color:${p.accent}`,
      defLabel:p.def?'DEFAULT':'', defStyle:p.def?"font-size:9px;font-family:'IBM Plex Mono',monospace;color:#8FB573;border:1px solid #8FB573;border-radius:3px;padding:1px 5px":'display:none'}));

    return { railItems, personas };
  }
}
</script>
</body>
</html>
